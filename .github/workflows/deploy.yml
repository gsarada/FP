name: Deploy FP

on:
  push:
    branches: [feature/fp-base]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - test
          - prod
      action:
        description: 'Terraform action to perform'
        required: true
        type: choice
        options:
          - apply
          - destroy
          - output
      module:
        description: 'Infra module'
        required: true
        default: 'all'
        type: choice
        options:
          - sagemaker
          - ingestion
          - researcher
          - database
          - agents
          - frontend
          - dashboard
      module-action:
        description: 'Action to perform'
        required: true
        default: 'all'
        type: choice
        options:
          - package
          - infra-deploy
          - app-deploy

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: Deploy to ${{ github.event.inputs.environment || 'dev' }}
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'dev' }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: github-actions-deploy
          aws-region: ${{ secrets.DEFAULT_AWS_REGION }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false  # Important: disable wrapper to get raw outputs

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: app/frontend/package-lock.json
      
      - name: Run Deployment Script
        run: |
          if [[ ${{inputs.action}} == "apply" ]]; then
            # Make script executable and run it
            chmod +x ./scripts/deploy.sh
            ./scripts/deploy.sh ${{ inputs.environment || 'dev' }} ${{ inputs.module || 'all' }} ${{ inputs.module-action }}
          fi
          if [[ ${{inputs.action}} == "destroy" ]]; then
            # Make script executable and run it
            chmod +x ./scripts/destroy.sh
            ./scripts/destroy.sh ${{ inputs.environment || 'dev' }} ${{ inputs.module || 'all' }}
          fi
          if [[ ${{inputs.action}} == "output" ]]; then
            # Make script executable and run it
            chmod +x ./scripts/get_outputs.sh
            ./scripts/deploy.sh ${{ inputs.environment || 'dev' }} ${{ inputs.module || 'all' }} ${{ inputs.module-action }}
          fi  
        env:
          AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
          AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
          DEFAULT_AWS_REGION: ${{ secrets.DEFAULT_AWS_REGION }}

      
  
  